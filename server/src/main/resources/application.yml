server:
  port: 8080

spring:
  application:
    name: daily-challenge-server
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 120
  daily:
    # IANA timezone for "today" / daily boundaries (default: Asia/Jerusalem)
    zone: Asia/Jerusalem
  uploads:
    # Directory for uploaded files (e.g. profile images). Created on startup if missing.
    dir: ./uploads
    # Base URL for public image URLs (e.g. http://localhost:8080). Override in production.
    public-base-url: http://localhost:8080
  frontend:
    # Base URL for links in emails (invitations, password reset, etc.). Override in production.
    base-url: http://localhost:5173
  password-reset:
    # Frontend base URL for reset link (e.g. http://localhost:5173). Override in production.
    base-url: http://localhost:5173
    expiration-minutes: 60

# Hugging Face Inference Providers (router) for AI-generated challenge images (when user does not upload an image).
# Set HF_TOKEN env var. If unset or generation fails, challenge gets fallback placeholder imageUrl.
# Endpoint: https://router.huggingface.co/hf-inference/models/{model}
huggingface:
  api:
    token: ${HF_TOKEN:}
    # Text-to-image model (must be available on Inference Providers). Default: FLUX.1-schnell (fast, router-supported).
    model: black-forest-labs/FLUX.1-schnell
    