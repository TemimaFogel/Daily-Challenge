app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-min-256-bits-for-hs256-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/daily_challenge
    username: dailychallenge
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
  spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000